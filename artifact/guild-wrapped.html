<title>Guild Wrapped</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Baloo+2:wght@600;700;800&display=swap">
<style id="gw-style">
/* Layout: a poster wall of character cards; a card opens a full-screen story, one stat per slide, then the next guildmate.
   One deliberate dark look: the guild addon's plum windows, pink titles and pastel rainbow rule. */
:root {
  color-scheme: dark;
  --bg: #15121B;
  --night: #0D0B11;
  --surface: #2B2235;
  --chip: #2A2433;
  --line: #3A3245;
  --text: #EDE6F2;
  --muted: #A79DB3;
  --pink: #F9B8D4;
  --peach: #FFC891;
  --butter: #FFF1A8;
  --mint: #BDE3A3;
  --sky: #A8D8F0;
  --lilac: #C9B6F2;
  --danger: #FF9AA2;
  --veil: rgba(13, 11, 17, 0.78);
  --glass: rgba(21, 18, 27, 0.6);
  --shade: rgba(21, 18, 27, 0.96);
  --track: rgba(237, 230, 242, 0.22);
  --rainbow: linear-gradient(90deg, var(--pink), var(--peach), var(--butter), var(--mint), var(--sky), var(--lilac));
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
html { background: var(--bg); }
body { background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 72px;
  display: grid; gap: 28px;
}

/* Header */
.top { display: grid; gap: 12px; }
.eyebrow-row { display: flex; align-items: center; gap: 8px; color: var(--pink); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.paw { width: 18px; height: 18px; flex: none; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(38px, 8vw, 72px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
h1 .w { background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; font-size: 16px; }
.rule { height: 3px; border-radius: 3px; background: var(--rainbow); max-width: 320px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.admin { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.storage { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.note { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 14px; }
.note p { margin: 0; flex: 1 1 280px; min-width: 0; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--text); font-weight: 600; font-size: 14px; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 50%; border: 0; background: var(--glass); color: var(--text); font-size: 16px; line-height: 1; }

/* Gallery */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 16px; }
.card-wrap { position: relative; }
.card { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; max-width: 100%; border: 1px solid var(--t-edge); border-radius: 18px; overflow: hidden; background: var(--surface); color: var(--text); text-align: left; box-shadow: 0 10px 30px var(--t-glow); transition: transform 0.2s ease, box-shadow 0.2s ease; }
.card-wrap:hover .card { transform: translateY(-3px); box-shadow: 0 14px 38px var(--t-glow), 0 0 0 1px var(--t-edge); }
.card .tint { position: absolute; inset: 0; background: var(--t-tint); pointer-events: none; }
.card .shade { position: absolute; inset: 0; background: linear-gradient(to top, var(--t-shade) 0%, var(--t-shade-mid) 40%, transparent 66%); pointer-events: none; }
.card .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px; display: grid; gap: 6px; pointer-events: none; z-index: 1; }
.card .name { font-family: var(--t-font); font-weight: 700; font-size: 17px; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.card .orn { width: 44px; height: 2px; border-radius: 2px; background: var(--t-rule); }
.card-hit { position: absolute; inset: 0; z-index: 2; padding: 0; border: 0; border-radius: inherit; background: transparent; touch-action: pan-y; }
.card-hit:focus-visible { outline: 2px solid var(--a1); outline-offset: -3px; }

/* Image carousel (cards and the story intro): arrows, dots, swipe */
.car { position: absolute; inset: 0; overflow: hidden; }
.car-track { display: flex; height: 100%; transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1); }
.car-track img { flex: 0 0 100%; width: 100%; height: 100%; max-width: none; object-fit: cover; user-select: none; -webkit-user-drag: none; }
.car-arrow { position: absolute; top: 50%; z-index: 3; width: 30px; height: 30px; margin-top: -15px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--glass); color: var(--text); font-size: 20px; line-height: 1; padding: 0 0 2px; }
.car-arrow.prev { left: 8px; }
.car-arrow.next { right: 8px; }
.car-arrow:hover { background: var(--veil); }
.car-dots { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 5px; pointer-events: none; }
.car-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--track); }
.car-dots i.on { background: var(--text); }
@media (prefers-reduced-motion: reduce) { .car-track { transition: none; } }
.card .sub { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.card .lvl { color: var(--cc); font-weight: 700; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); flex: none; }
.profs { display: flex; flex-wrap: wrap; gap: 4px; }
.profs span { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--t-chip); border: 1px solid var(--t-edge); }
.pill { position: absolute; top: 10px; z-index: 3; pointer-events: none; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.pill.example { left: 10px; background: var(--butter); color: var(--surface); }
.pill.clips { right: 10px; background: var(--glass); color: var(--text); border: 1px solid var(--line); }
.edit-btn { position: absolute; right: 10px; bottom: 10px; z-index: 4; padding: 5px 11px; font-size: 12px; }
.card-wrap.editable .card .info { padding-bottom: 46px; }
.empty { padding: 48px 20px; border: 1px dashed var(--line); border-radius: 18px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--text); font-size: 17px; }

/* Story */
.story { position: fixed; inset: 0; z-index: 50; background: var(--night); display: grid; place-items: center;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.story-bg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; filter: blur(38px) saturate(1.15) brightness(0.32); transform: scale(1.15); }
.frame { position: relative; width: min(100%, 440px); height: min(100%, 820px); display: flex; flex-direction: column; background: var(--t-shade-mid); border: 1px solid var(--t-edge); border-radius: 22px; overflow: hidden; box-shadow: 0 0 60px var(--t-glow); }
@media (max-width: 480px) { .frame { border-radius: 0; border: 0; height: 100%; } }
.bars { display: flex; gap: 4px; padding: 12px 14px 0; }
.bar { flex: 1; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--text); }
.story-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px 14px; }
.av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; border: 1px solid var(--line); }
.who { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
.who b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.host { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.tap { position: absolute; top: 0; bottom: 0; border: 0; background: transparent; padding: 0; z-index: 1; }
.tap.prev { left: 0; width: 32%; }
.tap.next { right: 0; width: 68%; }
.tap:focus-visible { outline-offset: -4px; }
.host.no-tap .tap { display: none; }
.story-foot { display: flex; justify-content: space-between; gap: 8px; padding: 8px 14px 14px; }
.story-foot .btn { min-width: 0; max-width: 48%; }
.story-foot .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.slide { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 18px 26px 26px; }
.slide > * { animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.slide > *:nth-child(2) { animation-delay: 0.08s; }
.slide > *:nth-child(3) { animation-delay: 0.16s; }
.slide > *:nth-child(4) { animation-delay: 0.24s; }
.slide > *:nth-child(5) { animation-delay: 0.32s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .slide > * { animation: none; } .card { transition: none; } .card-wrap:hover .card { transform: none; } }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--acc); }
.big { font-family: var(--t-font); font-weight: 800; font-size: clamp(54px, 16vw, 100px); line-height: 0.95; letter-spacing: -0.03em; color: var(--acc); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.big.mid { font-size: clamp(40px, 11vw, 64px); }
.cap { font-size: 19px; font-weight: 600; text-wrap: balance; }
.line { color: var(--muted); font-size: 15px; max-width: 34ch; }
.line strong { color: var(--text); }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; }
.quad div { display: grid; gap: 2px; min-width: 0; }
.quad b { font-family: var(--t-font); font-weight: 700; font-size: clamp(28px, 8vw, 40px); line-height: 1; color: var(--acc); font-variant-numeric: tabular-nums; }
.quad span { color: var(--muted); font-size: 13px; }
.intro-car { position: relative; z-index: 2; width: 100%; height: min(42vh, 420px); border-radius: 18px; overflow: hidden; border: 1px solid var(--t-edge); flex: none; }
.intro-name { font-family: var(--t-font); font-weight: 800; font-size: clamp(26px, 7vw, 34px); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.skills { display: grid; gap: 12px; }
.skill { display: grid; gap: 5px; }
.skill-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.skill-top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
.track { height: 8px; border-radius: 6px; background: var(--track); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 6px; background: var(--acc); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--t-edge); background: var(--t-chip); font-weight: 600; font-size: 14px; }
.clips-list { display: grid; gap: 14px; }
.clip { margin: 0; display: grid; gap: 6px; }
.clip video { width: 100%; max-height: 34vh; border-radius: 14px; background: var(--night); border: 1px solid var(--line); }
.clip figcaption { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.clip figcaption span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; flex: none; }
.outro-card { width: min(100%, 230px); align-self: center; pointer-events: none; }

/* Editor */
.modal { position: fixed; inset: 0; z-index: 60; background: var(--veil); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(100%, 580px); max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 18px; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.field { display: grid; gap: 6px; min-width: 0; }
.lbl { font-weight: 700; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; }
.hint code { font-family: var(--f-mono); font-size: 12px; color: var(--text); }
textarea, input[type="text"], select { width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { font-family: var(--f-mono); font-size: 12px; min-height: 84px; resize: vertical; word-break: break-all; }
input[type="file"] { width: 100%; font-size: 13px; color: var(--muted); }
.status { font-size: 13px; min-height: 1.4em; }
.status.ok { color: var(--mint); }
.status.err { color: var(--danger); }
.arts { display: flex; flex-wrap: wrap; gap: 10px; }
.art-th { position: relative; width: 78px; display: grid; gap: 4px; }
.art-th img { width: 78px; height: 104px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.art-th .cover { position: absolute; top: 4px; left: 4px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--butter); color: var(--surface); }
.art-th .row { display: flex; gap: 4px; }
.mini { flex: 1; padding: 3px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--text); font-size: 12px; line-height: 1.2; }
.mini[disabled] { opacity: 0.4; cursor: default; }
.look { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.look-prev { width: min(100%, 190px); flex: none; pointer-events: none; }
.themes { flex: 1 1 240px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.theme-opt { display: grid; gap: 5px; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: left; }
.theme-opt[aria-pressed="true"] { border-color: var(--a1); box-shadow: 0 0 0 1px var(--a1), 0 6px 18px var(--t-glow); }
.theme-opt .sw { height: 8px; border-radius: 6px; background: var(--t-rule); }
.theme-opt b { font-family: var(--t-font); font-size: 14px; line-height: 1.1; }
.theme-opt span { font-size: 11px; color: var(--muted); line-height: 1.3; }
.slots { display: grid; gap: 10px; }
.slot { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--chip); }
.slot-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.slot-row video { width: 96px; height: 54px; object-fit: cover; border-radius: 8px; background: var(--night); flex: none; }
.slot-row .grow { flex: 1 1 160px; min-width: 0; }
.slot-title { font-weight: 600; font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; }
.actions .spacer { flex: 1; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--danger); color: var(--danger); font-size: 14px; }

/* Card themes: each sets accents (--a1..--a6), card edge and glow, image tint, shading, chips, rule and name font. */

      ED.arts.forEach(function (a, i) {
        artsBox.append(h("div", { class: "art-th" },
          h("img", { src: a.url, alt: "Picture " + (i + 1) }),
          i === 0 ? h("span", { class: "cover", text: "Cover" }) : null,
          h("div", { class: "row" },
            h("button", { class: "mini", type: "button", "aria-label": "Move picture " + (i + 1) + " earlier", disabled: i === 0, onclick: function () { moveArt(i, -1); } }, "←"),
            h("button", { class: "mini", type: "button", "aria-label": "Remove picture " + (i + 1), onclick: function () { removeArt(i); } }, "✕"),
            h("button", { class: "mini", type: "button", "aria-label": "Move picture " + (i + 1) + " later", disabled: i === last, onclick: function () { moveArt(i, 1); } }, "→"))));
      });
      if (!ED.arts.length) artsBox.append(h("span", { class: "hint", text: "No pictures yet." }));
      updatePreview();
    }
    function moveArt(i, d) { var t = ED.arts[i]; ED.arts[i] = ED.arts[i + d]; ED.arts[i + d] = t; drawArts(); }
    function removeArt(i) { var a = ED.arts.splice(i, 1)[0]; if (a.kind === "old" && a.a.id) ED.removedArts.push(a.a.id); drawArts(); }
    sheet.append(h("div", { class: "field" },
      h("label", { class: "lbl", for: "ed-art", text: "Character art (at least 1, up to " + MAX_ARTS + " pictures)" }),
      h("div", { class: "hint", text: "Screenshots, drawings, commissions: anything of the character. The first picture is the cover; the rest show with the arrows or a swipe. Portrait shapes look best, and big images are shrunk to save space." }),
      artsBox, artInput, artStatus));
    sheet.append(h("div", { class: "field" },
      h("div", { class: "lbl", text: "Card theme (optional)" }),
      h("div", { class: "look" }, prevBox, themesBox)));
    drawArts();

    // clips
    var slots = h("div", { class: "slots" });
    ED.slots.forEach(function (s, i) { slots.append(slotEl(s, i)); });
    sheet.append(h("div", { class: "field" },
      h("div", { class: "lbl", text: "Memories (optional, up to 3 clips)" }),
      h("div", { class: "hint", text: "MP4 or WebM, 2 minutes at most and 20 MB each. They play on the Memories slide of this character's Wrapped." }),
      slots));

    // actions
    var progress = h("div", { class: "status", id: "ed-progress", "aria-live": "polite" });
    var confirmWrap = h("div");
    var del = c ? h("button", { class: "btn danger", type: "button", onclick: function () {
      if (confirmWrap.firstChild) return;
      confirmWrap.append(h("div", { class: "confirm" }, "Delete " + fullName(c) + " and their art and clips for good?",
        h("button", { class: "btn danger", type: "button", onclick: function () { removeChar(c, progress); } }, "Delete"),
        h("button", { class: "btn ghost", type: "button", onclick: function () { confirmWrap.innerHTML = ""; } }, "Keep")));
    } }, "Delete") : null;
    sheet.append(progress, confirmWrap, h("div", { class: "actions" }, del, h("span", { class: "spacer" }),
      h("button", { class: "btn ghost", type: "button", onclick: function () { if (!ED.busy) closeEditor(); } }, "Cancel"),
      h("button", { class: "btn primary", type: "submit", id: "ed-save" }, c ? "Save changes" : "Add to Guild Wrapped")));

    editorEl.innerHTML = ""; editorEl.append(sheet);
  }
  function onCode(val, status, pickWrap) {
    pickWrap.innerHTML = ""; ED.decoded = null; ED.pick = 0;
    var r;
    try { r = parseExport(val); } catch (e) { status.className = "status err"; status.textContent = e.message; if (ED.refresh) ED.refresh(); return; }
    if (!r) { status.className = "status"; status.textContent = ""; if (ED.refresh) ED.refresh(); return; }
    ED.decoded = r;
    var c0 = r.chars[0];
    status.className = "status ok";
    status.textContent = r.chars.length === 1
      ? "Found " + c0.n + ", level " + (c0.lvl || "?") + " " + classInfo(c0.cls)[0] + (c0.st && !c0.st.off ? ", with stats." : ". Stats sharing is off, so their Wrapped will be short.")
      : "Found " + r.chars.length + " characters. Pick one:";
    if (r.chars.length > 1) {
      var sel = h("select", { id: "ed-char", "aria-label": "Character", onchange: function () { ED.pick = Number(sel.value); if (ED.refresh) ED.refresh(); } },
        r.chars.map(function (x, i) { return h("option", { value: String(i), text: x.n + (x.sn ? " " + x.sn : "") + " · level " + (x.lvl || "?") + " " + classInfo(x.cls)[0] + (x.st && !x.st.off ? "" : " (no stats)") }); }));
      if (ED.existing) {
        var match = r.chars.findIndex(function (x) { return x.n === ED.existing.name; });
        if (match >= 0) { sel.value = String(match); ED.pick = match; }
      }
      pickWrap.append(sel);
    }
    if (ED.refresh) ED.refresh();
  }
  function slotEl(s, i) {
    var box = h("div", { class: "slot" });
    if (s.kind === "empty") {
      var st = h("div", { class: "status", "aria-live": "polite" });
      var inp = h("input", { type: "file", id: "ed-clip-" + i, accept: "video/mp4,video/webm", "aria-label": "Clip " + (i + 1), onchange: function () {
        var f = inp.files && inp.files[0]; if (!f) return;
        st.className = "status"; st.textContent = "Checking clip…";
        videoInfo(f).then(function (info) {
          ED.slots[i] = { kind: "new", file: f, dur: info.dur, url: info.url, title: f.name.replace(/\.[^.]+$/, "").slice(0, 60), removed: s.removed };
          box.replaceWith(slotEl(ED.slots[i], i));
        }).catch(function (e) { st.className = "status err"; st.textContent = e.message; inp.value = ""; });
      } });
      box.append(h("div", { class: "slot-title", text: "Clip " + (i + 1) }), inp, st);
      return box;
    }
    var src = s.kind === "new" ? s.url : clipUrl(s.clip);
    var dur = s.kind === "new" ? s.dur : s.clip.dur;
    var title = h("input", { type: "text", id: "ed-clip-title-" + i, maxlength: "60", value: s.title, "aria-label": "Clip " + (i + 1) + " title", placeholder: "What happened?", oninput: function () { s.title = title.value; } });
    box.append(h("div", { class: "slot-title", text: "Clip " + (i + 1) + " · " + clipTime(dur) + (s.kind === "new" ? " · new" : "") }),
      h("div", { class: "slot-row" }, h("video", { src: src, muted: true, preload: "metadata", playsinline: true }),
        h("div", { class: "grow" }, title),
        h("button", { class: "btn ghost", type: "button", onclick: function () { ED.slots[i] = { kind: "empty", removed: s.kind === "old" ? s.clip.id : (s.removed || null) }; box.replaceWith(slotEl(ED.slots[i], i)); } }, "Remove")));
    return box;
  }
  function setBusy(on, msg) {
    if (!editorEl) return;
    ED.busy = on;
    editorEl.querySelectorAll("button, input, textarea, select").forEach(function (b) { b.disabled = on; });
    var p = editorEl.querySelector("#ed-progress");
    if (p) { p.className = "status"; p.textContent = msg || ""; }
  }
  function fail(e, uploaded) {
    cleanup(uploaded);
    setBusy(false);
    var p = editorEl && editorEl.querySelector("#ed-progress");
    if (p) { p.className = "status err"; p.textContent = errText(e); }
  }
  function save() {
    if (!ED || ED.busy) return;
    var c = ED.existing, p = editorEl.querySelector("#ed-progress");
    var picked = ED.decoded ? ED.decoded.chars[ED.pick] : null;
    if (!c && !picked) { p.className = "status err"; p.textContent = "Paste the export code first. A character needs an export code and at least one picture; everything else is optional."; return; }
    if (!ED.arts.length) { p.className = "status err"; p.textContent = "Add at least one picture. Only characters with art are in Guild Wrapped."; return; }
    var uploaded = [], toDelete = ED.removedArts.slice();
    var chain = Promise.resolve();
    var newArts = ED.arts.filter(function (a) { return a.kind === "new"; }), an = 0;
    newArts.forEach(function (a) {
      chain = chain.then(function () {
        an++; setBusy(true, "Uploading picture " + an + " of " + newArts.length + "…");
        return ASSETS.upload(a.blob).then(function (r) { uploaded.push(r.id); a.id = r.id; });
      });
    });
    var clips = [];
    var newCount = ED.slots.filter(function (s) { return s.kind === "new"; }).length, n = 0;
    ED.slots.forEach(function (s) {
      if (s.kind === "empty") { if (s.removed) toDelete.push(s.removed); return; }
      if (s.kind === "old") { clips.push(Object.assign({}, s.clip, { title: (s.title || "").trim().slice(0, 60) })); return; }
      if (s.removed) toDelete.push(s.removed);
      chain = chain.then(function () {
        n++; setBusy(true, "Uploading clip " + n + " of " + newCount + "…");
        return ASSETS.upload(s.file).then(function (r) {
          uploaded.push(r.id);
          clips.push({ id: r.id, title: (s.title || "").trim().slice(0, 60), dur: Math.round(s.dur), type: s.file.type });
        });
      });
    });
    chain.then(function () {
      setBusy(true, "Saving…");
      var base = c ? Object.assign({}, c) : { id: newId(), added: Math.floor(Date.now() / 1000), by: myId };
      if (picked) { Object.assign(base, fromExport(picked, ED.decoded.t)); delete base.sample; }
      base.arts = ED.arts.map(function (a) { return a.kind === "old" ? a.a : { id: a.id }; });
      delete base.art;
      base.theme = ED.theme; base.clips = clips;
      if (base.sample && newArts.length) delete base.sample;
      var chars = DATA.chars.slice();
      var idx = c ? chars.findIndex(function (x) { return x.id === c.id; }) : -1;
      if (idx >= 0) chars[idx] = base; else chars.push(base);
      return publish({ v: 1, chars: chars });
    }).then(function () {
      cleanup(toDelete);
      setBusy(false, "Saved. Reloading…");
      toast(c ? "Saved" : "Added to Guild Wrapped");
    }).catch(function (e) { fail(e, uploaded); });
  }
  function removeChar(c, progress) {
    setBusy(true, "Deleting…");
    var ids = [];
    artsOf(c).forEach(function (a) { if (a.id) ids.push(a.id); });
    arr(c.clips).forEach(function (k) { if (k.id) ids.push(k.id); });
    publish({ v: 1, chars: DATA.chars.filter(function (x) { return x.id !== c.id; }) })
      .then(function () { cleanup(ids); toast("Deleted " + fullName(c)); })
      .catch(function (e) { fail(e, []); });
  }

  // ---------- start ----------
  renderShell();
  renderGallery();
  routeHash();

})();
</script>
